name: Build parallel Windows installer

on:
  push:
    branches:
      - optimize-parallel-decode
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run tests
        run: cargo test --workspace

      - name: Build Windows bundles
        run: npx --yes @tauri-apps/cli build

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: qmc-decoder-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: qmc-decoder-windows-portable
          path: src-tauri/target/release/qmc-decoder.exe
          if-no-files-found: error
